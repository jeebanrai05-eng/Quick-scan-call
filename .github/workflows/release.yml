name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*' # Triggers automatically when a version tag like v1.0.1 is pushed
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.2)'
        required: false
        default: 'v1.0.2'

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Signing and Secrets Configuration
        run: |
          # Ensure .env exists for Secrets Gradle Plugin
          touch .env
          echo "Created .env placeholder for build configuration"

          # Handle Release Keystore Signing
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Using production keystore from GitHub Secrets"
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/my-upload-key.jks"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "Generating signing keystore for automated release build"
            keytool -genkeypair -v \
              -keystore "$GITHUB_WORKSPACE/my-upload-key.jks" \
              -storepass android \
              -alias upload \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=QuickCallScan, OU=Android, O=QuickCallScan, L=London, ST=London, C=UK"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

      - name: Build Android Release APK
        run: |
          BUILD_VER_NAME=$(grep -o '"versionName": *"[^"]*"' version.json | head -n 1 | cut -d'"' -f4)
          BUILD_VER_CODE=$(grep -o '"versionCode": *[0-9]*' version.json | head -n 1 | awk '{print $2}')
          echo "Building APK for Version Name: ${BUILD_VER_NAME:-1.0.2} (code: ${BUILD_VER_CODE:-3})"
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleRelease -PversionCode=${BUILD_VER_CODE:-3} -PversionName=${BUILD_VER_NAME:-"1.0.2"} --stacktrace
          else
            gradle :app:assembleRelease -PversionCode=${BUILD_VER_CODE:-3} -PversionName=${BUILD_VER_NAME:-"1.0.2"} --stacktrace
          fi

      - name: Verify APK Generation
        run: |
          APK_RAW=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_RAW" ] || [ ! -f "$APK_RAW" ]; then
            echo "::error::Release APK was not generated! Build failed."
            exit 1
          fi
          
          echo "Found compiled release APK at: $APK_RAW"
          # Standardize filename to app-release.apk
          cp "$APK_RAW" "$GITHUB_WORKSPACE/app-release.apk"
          echo "APK_PATH=$GITHUB_WORKSPACE/app-release.apk" >> $GITHUB_ENV
          
          # Compute genuine SHA-256 for release verification
          SHA256_HASH=$(sha256sum "$GITHUB_WORKSPACE/app-release.apk" | awk '{print $1}')
          APK_SIZE=$(wc -c < "$GITHUB_WORKSPACE/app-release.apk" | tr -d ' ')
          echo "APK SHA-256: $SHA256_HASH"
          echo "APK Size: $APK_SIZE bytes"
          echo "APK_SHA256=$SHA256_HASH" >> $GITHUB_ENV
          echo "APK_SIZE=$APK_SIZE" >> $GITHUB_ENV

          # Inject real SHA256 and size into version.json for release distribution
          python3 -c "
import json
with open('version.json', 'r') as f:
    data = json.load(f)
data['sha256'] = '$SHA256_HASH'
data['fileSize'] = int('$APK_SIZE')
with open('version.json', 'w') as f:
    json.dump(data, f, indent=2)
"

      - name: Determine Release Tag
        id: release_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag_name }}"
            if [ -z "$TAG" ]; then
              VERSION_NAME=$(grep -o '"versionName": *"[^"]*"' version.json | head -n 1 | cut -d'"' -f4)
              TAG="v${VERSION_NAME:-1.0.2}"
            fi
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "Resolved release tag: $TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release with APK Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: Quick Call Scan ${{ steps.release_info.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ env.APK_PATH }}
            version.json
          body: |
            ## Quick Call Scan & Detect Caller ${{ steps.release_info.outputs.tag }}
            
            ### Automated GitHub Release
            - **Verified APK Asset:** `app-release.apk`
            - **SHA-256 Checksum:** `${{ env.APK_SHA256 }}`
            - **File Size:** `${{ env.APK_SIZE }} bytes`
            - **Package Name:** `com.aistudio.detectcaller.qkcall`
            - **Target OS:** Android 8.0+ (API 26+)
            
            ### Installation Instructions
            1. Download `app-release.apk` below directly to your Android device.
            2. Tap to install. Android will verify the package and preserve all existing app data.
            3. In-app updater in Settings will also discover and install future updates automatically!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
