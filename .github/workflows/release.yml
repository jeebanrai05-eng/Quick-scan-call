name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*' # Triggers on release tags like v1.0.1, v1.0.2

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew (if present)
        run: chmod +x ./gradlew 2>/dev/null || true

      - name: Prepare Secrets Configuration
        run: |
          # Create empty placeholder .env if not committed
          touch .env
          echo "Created .env placeholder for build configuration"

      - name: Build Android Release APK
        run: |
          # Use gradle or gradlew wrapper
          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleRelease --stacktrace
          else
            gradle :app:assembleRelease --stacktrace
          fi

      - name: Verify APK Generation
        run: |
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::Release APK was not generated! Build failed."
            exit 1
          fi
          echo "Found release APK: $APK_FILE"
          echo "APK_PATH=$APK_FILE" >> $GITHUB_ENV
          
          # Compute SHA-256 for release verification
          SHA256_HASH=$(sha256sum "$APK_FILE" | awk '{print $1}')
          echo "APK SHA-256: $SHA256_HASH"
          echo "APK_SHA256=$SHA256_HASH" >> $GITHUB_ENV

      - name: Extract Release Tag & Changelog
        id: release_info
        run: |
          TAG_NAME="${{ github.ref_name }}"
          echo "Tag: $TAG_NAME"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release with APK Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: Quick Call Scan ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ env.APK_PATH }}
            version.json
          body: |
            ## Quick Call Scan & Detect Caller ${{ github.ref_name }}
            
            ### Automated GitHub Release
            - **Verified APK Asset:** Included below (`app-release.apk`)
            - **SHA-256 Hash:** `${{ env.APK_SHA256 }}`
            
            ### Installation Instructions
            1. Download the `.apk` file below.
            2. Open on your Android device (Android 8.0+ / API 26+ required).
            3. In-app updater in Settings will also discover this version automatically!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
